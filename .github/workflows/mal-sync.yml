name: Sync MyAnimeList completed list

# Fetches directly from MyAnimeList's own list-loading endpoint (the same
# one myanimelist.net's own pages use, and the same one Jikan calls under
# the hood) rather than going through Jikan. Jikan has had a documented,
# sustained run of 504 errors across many of its endpoints as of mid-2026,
# so this cuts that unreliable middle layer out entirely. No key needed —
# this is an unauthenticated, publicly-readable endpoint, same as the
# community profile pages themselves.
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write

env:
  # Replace with your own MyAnimeList username if it's ever not "Entertained".
  MAL_USERNAME: "Entertained"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch completed anime list directly from MyAnimeList
        run: |
          mkdir -p data
          success=false

          # status=2 is MAL's own internal code for "Completed" (visible in
          # the original list URL: myanimelist.net/animelist/USER?status=2).
          for i in 1 2 3 4 5; do
            status=$(curl -sL \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -H "Accept: application/json" \
              -o /tmp/mal-raw.json -w "%{http_code}" \
              "https://myanimelist.net/animelist/${MAL_USERNAME}/load.json?status=2&offset=0")

            if [ "$status" = "200" ] && head -c 1 /tmp/mal-raw.json | grep -q "\["; then
              success=true
              break
            fi

            echo "Attempt $i failed (HTTP $status). Retrying in 15s..."
            sleep 15
          done

          if [ "$success" != "true" ]; then
            echo "Could not get a valid response from MyAnimeList after 5 attempts."
            echo "----- first 500 characters of the actual response, for debugging -----"
            head -c 500 /tmp/mal-raw.json
            echo ""
            echo "-----------------------------------------------------------------------"
            echo "Leaving the existing data/mal-list.json untouched."
            exit 0
          fi

          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("/tmp/mal-raw.json", "utf8"));

            // MALs own load.json field names, read defensively in case of
            // minor naming variance across list styles/versions.
            const entries = raw
              .map(item => ({
                title: item.anime_title || item.anime_title_eng || "Untitled",
                image: item.anime_image_path || "",
                score: item.score || 0
              }))
              .filter(e => e.image)
              .sort((a, b) => b.score - a.score);

            fs.writeFileSync("data/mal-list.json", JSON.stringify(entries, null, 2) + "\n");
            console.log(`wrote ${entries.length} entries to data/mal-list.json`);
          '

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mal-list.json
          git diff --staged --quiet || git commit -m "chore: sync MAL completed list"
          git push
