name: Sync Steam library

# No API key needed. This reads the public XML feed that Steam's own
# community pages use (https://steamcommunity.com/profiles/<id>/games?tab=all&xml=1),
# which requires no key at all — only that your profile's "Game details"
# privacy setting is Public. Runs server-side on GitHub's infrastructure
# on a schedule, and commits the result to data/steam-games.json.
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write

env:
  # Replace with your own SteamID64 (a long numeric ID — look yours up at
  # https://steamid.io if you only know your custom profile URL/vanity name).
  STEAM_ID: "76561198929782130"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch owned games from Steam's public XML feed
        run: |
          mkdir -p data
          curl -sL \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            "https://steamcommunity.com/profiles/${STEAM_ID}/games/?tab=all&xml=1" \
            -o /tmp/steam-raw.xml

          if ! grep -q "<gamesList>" /tmp/steam-raw.xml; then
            echo "Could not read a games list. Most likely cause: your Steam profile's"
            echo "'Game details' privacy setting isn't Public, or STEAM_ID is wrong."
            echo "----- first 500 characters of the actual response, for debugging -----"
            head -c 500 /tmp/steam-raw.xml
            echo ""
            echo "-------------------------------------------------------------------"
            echo "Leaving the existing data/steam-games.json untouched."
            exit 0
          fi

          node -e '
            const fs = require("fs");
            const xml = fs.readFileSync("/tmp/steam-raw.xml", "utf8");

            const getTag = (block, tag) => {
              const m = block.match(new RegExp(`<${tag}>([\\s\\S]*?)</${tag}>`));
              if (!m) return null;
              return m[1].replace(/<!\[CDATA\[/, "").replace(/\]\]>/, "").trim();
            };

            const blocks = xml.match(/<game>[\s\S]*?<\/game>/g) || [];

            const games = blocks
              .map(block => ({
                appid: getTag(block, "appID"),
                name: getTag(block, "name"),
                hoursRaw: getTag(block, "hoursOnRecord")
              }))
              .filter(g => g.appid && g.name && g.hoursRaw)
              .map(g => ({
                appid: Number(g.appid),
                name: g.name,
                hours: parseFloat(g.hoursRaw.replace(/,/g, "")),
                header: `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/header.jpg`
              }))
              .sort((a, b) => b.hours - a.hours);

            fs.writeFileSync("data/steam-games.json", JSON.stringify(games, null, 2) + "\n");
            console.log(`wrote ${games.length} games to data/steam-games.json`);
          '

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/steam-games.json
          git diff --staged --quiet || git commit -m "chore: sync steam library"
          git push
