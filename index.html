<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>~/profile</title>
<meta name="description" content="Personal profile — about me, PC specs, contacts, and GitHub projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>

<!-- ===================== NAV ===================== -->
<header class="nav">
  <div class="nav-inner">
    <div class="nav-left">
      <div class="nav-badges" id="nav-badges" aria-label="Achievements">
        <!-- populated by script.js from CONFIG.achievements (2 slots) -->
      </div>
      <a href="#top" class="nav-brand" id="nav-brand">
        <span class="nav-brand-bracket">[</span><span id="nav-brand-name">USER</span><span class="nav-brand-bracket">]</span>
      </a>
    </div>
    <nav class="nav-links">
      <a href="#about"><span class="idx">01</span>ABOUT</a>
      <a href="#specs"><span class="idx">02</span>SPECS</a>
      <a href="#connect"><span class="idx">03</span>CONNECT</a>
      <a href="#projects"><span class="idx">04</span>PROJECTS</a>
    </nav>
  </div>
</header>

<main id="top">

  <!-- ===================== HERO ===================== -->
  <section class="hero">
    <div class="hero-grid" aria-hidden="true"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">// SYSTEM PROFILE — STATUS: <span class="status-dot"></span>ONLINE</p>
      <h1 class="hero-name" id="hero-name" data-text="USER">USER</h1>
      <p class="hero-tagline" id="hero-tagline">Are you entertained?</p>
      <a href="#about" class="hero-scroll">
        <span>scroll</span>
        <span class="hero-scroll-line"></span>
      </a>
    </div>
  </section>

  <!-- ===================== ABOUT ===================== -->
  <section id="about" class="section">
    <div class="section-inner">
      <h2 class="section-title"><span class="idx">01</span>About</h2>
      <div class="about-text" id="about-text">
        <!-- populated by script.js from CONFIG.about -->
      </div>
    </div>
  </section>

  <!-- ===================== SPECS ===================== -->
  <section id="specs" class="section section-alt">
    <div class="section-inner">
      <h2 class="section-title"><span class="idx">02</span>Rig Specs</h2>
      <div class="terminal">
        <div class="terminal-bar">
          <span class="terminal-dot"></span>
          <span class="terminal-dot"></span>
          <span class="terminal-dot"></span>
          <span class="terminal-title">specs.sh</span>
        </div>
        <div class="terminal-body" id="specs-list">
          <!-- populated by script.js from CONFIG.specs -->
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== CONNECT ===================== -->
  <section id="connect" class="section">
    <div class="section-inner">
      <h2 class="section-title"><span class="idx">03</span>Connect</h2>
      <div class="connect-grid" id="connect-grid">
        <!-- populated by script.js from CONFIG.socials -->
      </div>
    </div>
  </section>

  <!-- ===================== PROJECTS ===================== -->
  <section id="projects" class="section section-alt">
    <div class="section-inner">
      <div class="section-title-row">
        <h2 class="section-title"><span class="idx">04</span>Projects</h2>
        <div class="carousel-controls">
          <button class="carousel-btn" id="carousel-prev" aria-label="Previous project">&larr;</button>
          <button class="carousel-btn" id="carousel-next" aria-label="Next project">&rarr;</button>
        </div>
      </div>

      <p class="carousel-status" id="carousel-status">loading repositories…</p>

      <div class="carousel" id="carousel" tabindex="0" aria-label="GitHub projects carousel">
        <div class="carousel-track" id="carousel-track">
          <!-- populated by script.js via GitHub API -->
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <p>built from scratch entirely vibcoded with Claude AI, hosted on GitHub Pages · <span id="footer-year"></span></p>
</footer>

<script src="script.js"></script>
</body>
</html>
